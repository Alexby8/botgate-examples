<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Корзина чайной</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font: 16px/1.5 system-ui; margin: 0 auto; padding: 20px; max-width: 560px;
      color: var(--tg-theme-text-color, #171c1b); background: var(--tg-theme-bg-color, #f6f7f4); }
    h1,h2 { line-height: 1.15; }
    .row { display: flex; gap: 12px; align-items: center; padding: 12px 0;
      border-bottom: 1px solid var(--tg-theme-hint-color, #b9c5bd); }
    .row span { flex: 1; }
    button { font: inherit; min-height: 44px; min-width: 44px; padding: 8px 12px; }
    #controls { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    #status { min-height: 24px; }
  </style>
</head>
<body>
  <h1>Корзина чайной</h1>
  <p>Самовывоз из чайной</p>
  <section id="products" aria-label="Товары"></section>
  <p id="total"></p>
  <div id="preview" hidden></div>
  <div id="controls">
    <button id="calculate">Получить расчёт</button>
    <button id="place" hidden>Оформить</button>
    <button id="retry" hidden>Проверить заказ снова</button>
  </div>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="app.js" defer></script>
</body>
</html>
