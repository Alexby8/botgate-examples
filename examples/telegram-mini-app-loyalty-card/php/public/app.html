<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Бонусная карта</title>
<style>body{font:17px/1.5 system-ui;background:#eef3f7;color:#183047;margin:0}main{max-width:650px;margin:auto;padding:24px}h1{font-size:26px}article{background:#224b77;color:white;border-radius:18px;padding:24px}#balance{font-size:40px;font-weight:bold}button,input,select{box-sizing:border-box;width:100%;font:inherit;border:1px solid #a6b6c8;padding:12px;border-radius:9px;margin:8px 0}button{background:#28634f;color:white}li{padding:12px 0;border-bottom:1px solid #cbd7e4}label{display:block}</style>
<main><h1>Ваша бонусная карта</h1><article><div id="balance">—</div><p>1 балл = 1 ₽ скидки · до 30% заказа</p></article><p id="status" role="status">Загружаем данные…</p><p id="expiry"></p>
<button id="refresh">Обновить</button><form id="form"><label>Заказ<select id="orders" required></select></label><label>Желаемое списание<input id="points" type="number" min="0" step="1" required value="0"></label><button id="save" disabled>Сохранить пожелание</button></form>
<small>Баллы пока не резервируются и не списываются. Касса повторно проверит баланс при подтверждении покупки.</small><h2>Последние операции</h2><ul id="history"></ul></main>
<script src="https://telegram.org/js/telegram-web-app.js"></script><script>
const tg=window.Telegram?.WebApp;tg?.ready();const status=document.querySelector('#status'),save=document.querySelector('#save'),orders=document.querySelector('#orders'),points=document.querySelector('#points');
async function load(body){save.disabled=true;try{const r=await fetch('api.php',{method:body?'POST':'GET',headers:{'X-Telegram-Init-Data':tg?.initData||'',...(body?{'Content-Type':'application/json'}:{})},...(body?{body:JSON.stringify(body)}:{})});const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#balance').textContent=d.balance+' баллов';document.querySelector('#expiry').textContent=d.lots.length?'Ближайшее сгорание: '+d.lots[0].remaining+' баллов '+new Date(d.lots[0].expires_at*1000).toLocaleDateString('ru-RU'):'Нет баллов со сроком действия.';
orders.replaceChildren();for(const o of d.orders){const option=document.createElement('option');option.value=o.id;option.dataset.points=o.requested;option.textContent=o.id+' · '+(o.total_minor/100).toLocaleString('ru-RU')+' ₽ · запрошено '+o.requested;orders.append(option);}orders.onchange=()=>{points.value=orders.selectedOptions[0]?.dataset.points||0;};orders.onchange();
const history=document.querySelector('#history');history.replaceChildren();for(const h of d.history){const li=document.createElement('li');li.textContent=new Date(h.created_at*1000).toLocaleDateString('ru-RU')+' · '+h.kind+' · '+(h.delta>0?'+':'')+h.delta;history.append(li);}status.textContent=d.review?'По возврату нужна сверка. Новые операции оплаты с бонусами приостановлены.':body?'Пожелание сохранено. Это ещё не списание.':'Данные обновлены.';save.disabled=d.review||d.orders.length===0;
}catch(e){status.textContent=e.message||'Нет связи. Баланс неизвестен.';document.querySelector('#balance').textContent='—';}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();load({order:orders.value,points:Number(points.value)});};document.querySelector('#refresh').onclick=()=>load();load();
</script></html>
