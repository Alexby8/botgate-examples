<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Заявка на консультацию</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;padding:22px;font:16px/1.5 system-ui;background:var(--tg-theme-bg-color,#f4f7fb);color:var(--tg-theme-text-color,#17212b)}main{max-width:560px;margin:auto}h1{font-size:25px;margin:0 0 12px}label{display:block;margin:18px 0 7px}select,textarea,button{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #aab8ca}textarea{min-height:180px;resize:vertical}button{margin-top:12px;background:var(--tg-theme-button-color,#2869b0);color:var(--tg-theme-button-text-color,#fff);border:0}button:disabled{opacity:.55}#status{position:sticky;top:0;padding:12px;background:var(--tg-theme-secondary-bg-color,#e4edf8);border-radius:10px}small{display:block;margin-top:12px;color:#68798e}
</style></head><body><main>
<h1>Заявка на консультацию</h1>
<p id="status" role="status">Загружаем черновик…</p>
<label for="topic">Тема</label><select id="topic" disabled><option value="consultation">Консультация</option><option value="migration">Перенос данных</option></select>
<label for="question">Ваш вопрос</label><textarea id="question" maxlength="10000" disabled></textarea>
<button id="save" disabled>Сохранить черновик</button>
<button id="submit" disabled>Отправить заявку</button>
<button id="retry" hidden>Повторить неподтверждённую операцию</button>
<button id="reload" hidden>Загрузить серверную версию</button>
<button id="new" hidden>Новая заявка</button>
<small>Черновик хранится семь дней после последнего сохранения. Перед закрытием дождитесь подтверждения.</small>
</main><script type="module">
const tg=window.Telegram?.WebApp;
const el=id=>document.getElementById(id);
const status=text=>{el('status').textContent=text;};
let draft, timer, pending=null, busy=false, dirty=false, ready=false;
const fields=()=>({topic:el('topic').value,question:el('question').value});
function controls(){
  const locked=!ready||busy||!!pending||draft?.state!=='editing';
  for(const id of ['topic','question','save','submit'])el(id).disabled=locked;
  el('retry').hidden=!pending;el('retry').disabled=busy;
  el('new').hidden=!draft||draft.state==='editing';
  el('new').disabled=busy||!!pending;
}
async function api(body){
  const response=await fetch('./api.php',{
    method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':tg?.initData??''},
    body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(15000)
  });
  const result=await response.json();
  if(!response.ok)throw Object.assign(new Error(result.error||'Ошибка сервера'),{status:response.status});
  if(!result.draftId||!Number.isInteger(result.revision))throw new Error('Неожиданный ответ сервера');
  return result;
}
function display(){
  el('topic').value=draft.fields.topic||'consultation';el('question').value=draft.fields.question||'';
  status(draft.state==='submitted'?'Заявка №'+draft.applicationId+' принята. Черновик очищен.':
    draft.state==='expired'?'Срок хранения истёк. Начните новую заявку.':
    draft.fields.question?'Черновик восстановлен':'Можно начать заполнение');
}
async function load(){
  ready=false;controls();
  try{draft=await api();pending=null;dirty=false;ready=true;display();el('reload').hidden=true;}
  catch(error){status(error.message);el('reload').hidden=false;}
  controls();
}
async function send(action){
  clearTimeout(timer);if(busy)return;
  if(!pending){
    if(!ready)return;
    pending={action,operationId:crypto.randomUUID(),draftId:draft.draftId,revision:draft.revision,
      ...(action==='new'?{}:{fields:fields()})};
  }
  busy=true;controls();status('Сохраняем…');
  try{
    const sent=pending;draft=await api(sent);pending=null;dirty=false;ready=true;
    display();if(draft.state==='editing'&&sent.action==='save')status('Черновик сохранён');
    el('reload').hidden=true;
  }catch(error){
    status(error.message+(error.status===409?' Скопируйте свой текст перед загрузкой серверной версии.':''));
    if(error.status===409||error.status===401){pending=null;ready=false;el('reload').hidden=false;}
    else if(error.status===422){pending=null;}
    // При таймауте/503 payload и operationId сохраняются, поля заблокированы.
  }finally{busy=false;controls();}
}
for(const id of ['topic','question'])el(id).addEventListener('input',()=>{
  dirty=true;status('Есть несохранённые изменения');clearTimeout(timer);
  timer=setTimeout(()=>send('save'),800);
});
el('save').onclick=()=>send('save');el('submit').onclick=()=>send('submit');
el('retry').onclick=()=>send(pending.action);el('new').onclick=()=>send('new');
el('reload').onclick=()=>{if(!dirty||confirm('Загрузить серверную версию? Сначала скопируйте свой текст.'))load();};
if(tg?.initData){tg.ready();load();}else status('Откройте форму через меню Telegram-бота.');
</script></body></html>
